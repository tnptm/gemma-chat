# SearXNG for the chat's web_search tool. Loopback only, used by Django via the JSON API.
# Everything not set here comes from SearXNG's defaults.
use_default_settings: true

general:
  instance_name: "gemma-chat search"

server:
  # Overridden at container start by a random SEARXNG_SECRET (see compose.yaml)
  secret_key: "replaced-at-runtime"
  limiter: false          # only reachable from this machine
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 1
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0
