# Ollama runs on the host (127.0.0.1:11434, with GPU access and pulled models).
# Both services use host networking, so Django stays bound to loopback and
# reaches Ollama exactly as it does outside Docker. Linux only.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    network_mode: host
    env_file: backend/.env
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Meta-search engine for the chat's web_search tool (JSON API on 127.0.0.1:8888)
  searxng:
    image: searxng/searxng:2026.10.25-54ca1d9cf
    network_mode: host
    user: "977:977"   # image's searxng user; never chowns the bind-mounted settings
    environment:
      GRANIAN_HOST: 127.0.0.1
      GRANIAN_PORT: "8888"
      FORCE_OWNERSHIP: "false"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    # Fresh random secret on every start; nothing persistent depends on it
    entrypoint: ["/bin/sh", "-c", "export SEARXNG_SECRET=$$(head -c 32 /dev/urandom | base64 | tr -dc A-Za-z0-9); exec /usr/local/searxng/entrypoint.sh"]
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      args:
        BACKEND_URL: http://127.0.0.1:8000
    network_mode: host
    environment:
      PORT: 3000
    depends_on:
      - backend
    restart: unless-stopped
